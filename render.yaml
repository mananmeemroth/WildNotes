services:
  - type: web
    name: wildnotes
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    envVars:
      - key: PORT
        value: 7860
      - key: HOST
        value: 0.0.0.0
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
